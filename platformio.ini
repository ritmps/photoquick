; PlatformIO Project Configuration File
; Raspberry Pi Pico (RP2040) Light Measurement Tool
;
; Environments:
;   - pico       : Standard USB drag-and-drop / picotool upload (debug via Pi Debug Probe)
;   - pico_probe : Upload & debug directly over SWD using Raspberry Pi Debug Probe (CMSIS-DAP)

[platformio]
default_envs = pico

[env]
platform = raspberrypi
board = pico
framework = arduino
monitor_speed = 115200
build_flags =
    -O3

[env:pico]
; Upload via USB bootloader (picotool / UF2)
upload_protocol = picotool
debug_tool = cmsis-dap

[env:pico_probe]
; Upload AND debug via Raspberry Pi Debug Probe (CMSIS-DAP) - no BOOTSEL button needed
upload_protocol = cmsis-dap
debug_tool = cmsis-dap
